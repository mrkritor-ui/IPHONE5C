name: update photo manifest

on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate photos.json
        run: |
          cd photos
          # list image files, newest first, skip the manifest itself and dotfiles
          find . -maxdepth 1 -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.heic" -o -iname "*.webp" -o -iname "*.gif" \) \
            -printf '%T@ %f\n' | sort -rn | cut -d' ' -f2- | \
            python3 -c "import sys, json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))" > photos.json
          cat photos.json

      - name: commit manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update photos.json"
          file_pattern: photos/photos.json
