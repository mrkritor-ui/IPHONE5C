name: sort photos and update manifest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sort-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: move any loose images from repo root into photos/
        run: |
          shopt -s nullglob nocaseglob
          moved=0
          for f in *.jpg *.jpeg *.png *.heic *.webp *.gif; do
            [ -e "$f" ] || continue
            mv "$f" "photos/$f"
            moved=1
          done
          echo "moved=$moved" >> "$GITHUB_ENV"

      - name: generate photos.json
        run: |
          cd photos
          find . -maxdepth 1 -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.heic" -o -iname "*.webp" -o -iname "*.gif" \) \
            -printf '%T@ %f\n' | sort -rn | cut -d' ' -f2- | \
            python3 -c "import sys, json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))" > photos.json
          cat photos.json

      - name: commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sort new photos and update manifest"
          file_pattern: "photos/* *.jpg *.jpeg *.png *.heic *.webp *.gif"
