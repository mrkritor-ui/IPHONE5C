<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iPhone 5c</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="titlebar">
      <h1>iPhone 5c</h1>
      <label class="uploadButton" for="photoInput">Upload</label>
      <input id="photoInput" type="file" accept="image/*" multiple>
    </div>
    <div class="subbar">
      <span id="uploadStatus">Photos</span>
      <div id="modes">
        <button data-cols="6">Small</button>
        <button data-cols="4" class="active">Medium</button>
        <button data-cols="2">Large</button>
      </div>
    </div>
  </header>

  <main id="grid"></main>

  <div id="empty" class="hidden">No Photos</div>

  <div id="viewer" class="hidden">
    <button id="closeViewer">Done</button>
    <img id="viewerImg" src="" alt="">
  </div>

  <script src="app.js"></script>
</body>
</html>
